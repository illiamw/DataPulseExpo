name: DataPulse CI/CD

on:
  push:
    branches:
      - main

jobs:

  # ============================================================
  # ANDROID
  # ============================================================
  android:
    name: Build and Submit Android
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: datapulse

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: datapulse/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build and submit Android
        run: eas build --platform android --profile production --auto-submit --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}


  # ============================================================
  # WEB / ORACLE CLOUD
  # ============================================================
  web-deploy:
    name: Deploy Web to Oracle Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "========================================"
            echo "DataPulse Web Deployment"
            echo "========================================"

            echo "Servidor:"
            hostname

            echo "Usuário:"
            whoami

            echo "Atualizando projeto..."

            cd ~/DataPulseExpo

            git pull origin main

            echo "Entrando no projeto..."

            cd datapulse

            echo "Construindo imagem Web..."

            docker compose -f docker-compose.web.yml build --no-cache

            echo "Subindo container..."

            docker compose -f docker-compose.web.yml up -d

            echo "Limpando imagens antigas..."

            docker image prune -f

            echo "========================================"
            echo "Deploy concluído"
            echo "========================================"

            docker compose -f docker-compose.web.yml ps